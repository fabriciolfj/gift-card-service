server:
  shutdown: graceful
  port: 8080
  tomcat:
    max-keep-alive-requests: 100

giftcard:
  code:
    pepper: ${GIFTCARD_CODE_PEPPER:RYA3HkwqGUTzPqF93FU3EQ0Kaveoarg/4gHYiv/SPPNjXdBaalNvlbyBR+WjrIgA}
  order:
    min-amount-cents: 2000          # R$ 20,00
    max-amount-cents: 100000        # R$ 1.000,00
    amount-multiple-cents: 100      # 1 = desligado. 100 = reais inteiros
  expiry:
    default-policy-ref: STANDARD_12M
    policies:
      STANDARD_12M: { months: 12 }
  idempotency:
    retention: P7D
    key-min-length: 16
    key-max-length: 64

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  metrics:
    tags:
      applicaiton: giftcard-service
spring:
  application:
    name: giftcard-service
  datasource:
    url: jdbc:postgresql://localhost:5432/giftcard
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
